<body>

<h1>Shortest path and minimum spanning tree</h1>
<p class="sub">CT 19. Two algorithms, one weighted graph, the same min-heap &mdash; and a
   different question each. Every step shows the line running, the heap, and what it changed.</p>

<div id="selftest">checking&hellip;</div>

<script>
"use strict";

// ---------------------------------------------------------------------------
// The graph. The same five edges as src/main.cpp, so the numbers on screen are
// the numbers the program prints -- a stepper that used its own graph would be
// a different problem wearing the same name.
// ---------------------------------------------------------------------------
var GRAPHS = {
  demo: {
    label: "the demo graph (src/main.cpp)",
    note: "The five edges your own program builds.",
    edges: [["SLC","Ogden",4],["SLC","Provo",6],["SLC","Logan",3],
            ["Ogden","Logan",5],["Provo","Logan",2]],
    pos: { Logan:[260,62], Ogden:[80,178], SLC:[260,236], Provo:[440,178] },
    source: "SLC"
  },
  // Prim's never rejects an edge on the demo graph: the tree is finished
  // before the leftover edges reach the top of the heap, so the `continue`
  // line -- the one that stops you building a cycle -- is never demonstrated.
  // This graph makes it fire. Saying so is the teaching point, the same way
  // CT 18 keeps a second preset for the one-child case.
  cycle: {
    label: "a graph that rejects an edge",
    note: "Here Prim's pops an edge whose far end is already in the tree, and " +
          "the cycle check earns its keep.",
    edges: [["Alta","Brighton",1],["Brighton","Solitude",2],
            ["Alta","Solitude",3],["Solitude","Park City",10]],
    pos: { Brighton:[250,62], Alta:[90,215], Solitude:[300,215], "Park City":[470,130] },
    source: "Alta"
  }
};
var EDGES, POS, SOURCE, ADJ, VERTS;
var INF = Infinity;

function adj() {
  var a = {};
  EDGES.forEach(function (e) {
    (a[e[0]] = a[e[0]] || []).push({ to: e[1], w: e[2] });
    (a[e[1]] = a[e[1]] || []).push({ to: e[0], w: e[2] });
  });
  return a;
}
function useGraph(key) {
  var g = GRAPHS[key];
  EDGES = g.edges; POS = g.pos; SOURCE = g.source;
  ADJ = adj(); VERTS = Object.keys(POS);
}
useGraph("demo");

// A heap is an implementation detail; what matters on screen is which entry
// comes out next. Kept as a sorted array so the picture cannot disagree with
// the order -- and sorted stably, so equal keys pop in push order.
function heapPush(h, item) { h.push(item); h.sort(function (a, b) { return a[0] - b[0]; }); }
function heapPop(h) { return h.shift(); }
function copyHeap(h) { return h.map(function (x) { return x.slice(); }); }
// An undirected edge named the same way whichever end you came from.
function edgeId(a, b) { return a < b ? a + "|" + b : b + "|" + a; }

// ---------------------------------------------------------------------------
// Code listings -- the solution's own lines, so a student can follow along in
// their editor.
// ---------------------------------------------------------------------------
var CODE = {
  dijkstra: [
    "std::unordered_map<std::string, int>",
    "WeightedGraph::dijkstra(const std::string& source) const {",
    "    std::unordered_map<std::string, int> dist;",
    "    for (const auto& [vertex, edges] : adj_list_) {",
    "        dist[vertex] = std::numeric_limits<int>::max();",
    "    }",
    "    if (!has_vertex(source)) return dist;",
    "    dist[source] = 0;",
    "",
    "    using Pair = std::pair<int, std::string>;",
    "    std::priority_queue<Pair, std::vector<Pair>, std::greater<Pair>> min_heap;",
    "    min_heap.push({0, source});",
    "",
    "    while (!min_heap.empty()) {",
    "        auto [popped_dist, current] = min_heap.top();",
    "        min_heap.pop();",
    "        if (popped_dist > dist[current]) continue;  // stale, already beaten",
    "",
    "        for (const auto& edge : adj_list_.at(current)) {",
    "            const int new_dist = dist[current] + edge.weight;",
    "            if (new_dist < dist[edge.to]) {",
    "                dist[edge.to] = new_dist;",
    "                min_heap.push({new_dist, edge.to});",
    "            }",
    "        }",
    "    }",
    "    return dist;",
    "}"
  ],
  prims: [
    "std::pair<std::vector<std::tuple<std::string, std::string, int>>, int>",
    "WeightedGraph::prims_mst(const std::string& start) const {",
    "    std::vector<std::tuple<std::string, std::string, int>> mst_edges;",
    "    int total_weight = 0;",
    "",
    "    std::unordered_set<std::string> in_mst;",
    "    in_mst.insert(start);",
    "",
    "    using EdgeTuple = std::tuple<int, std::string, std::string>;",
    "    std::priority_queue<EdgeTuple, std::vector<EdgeTuple>,",
    "                        std::greater<EdgeTuple>> min_heap;",
    "    for (const auto& edge : adj_list_.at(start)) {",
    "        min_heap.push({edge.weight, start, edge.to});",
    "    }",
    "",
    "    const int V = vertex_count();",
    "    while (!min_heap.empty() && (int)in_mst.size() < V) {",
    "        auto [w, from, to] = min_heap.top();",
    "        min_heap.pop();",
    "        if (in_mst.count(to)) continue;   // both ends already in -- a cycle",
    "",
    "        mst_edges.push_back({from, to, w});",
    "        total_weight += w;",
    "        in_mst.insert(to);",
    "",
    "        for (const auto& edge : adj_list_.at(to)) {",
    "            if (!in_mst.count(edge.to)) {",
    "                min_heap.push({edge.weight, to, edge.to});",
    "            }",
    "        }",
    "    }",
    "    return {mst_edges, total_weight};",
    "}"
  ]
};

var HL_KW = ("auto const continue for if int return using while std".split(" "));
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function hl(line) {
  var i = line.indexOf("//");
  var code = i === -1 ? line : line.slice(0, i);
  var cm = i === -1 ? "" : line.slice(i);
  var out = esc(code)
    .replace(/\b(\d+)\b/g, '<span class="nu">$1</span>')
    .replace(/\b(auto|const|continue|for|if|return|using|while|int|bool)\b/g,
             '<span class="kw">$1</span>')
    .replace(/\b(std|unordered_map|unordered_set|vector|string|pair|tuple|priority_queue|greater|size_t)\b/g,
             '<span class="ty">$1</span>');
  if (cm) out += '<span class="cm">' + esc(cm) + "</span>";
  return out;
}

// ---------------------------------------------------------------------------
// Dijkstra -- frames
// ---------------------------------------------------------------------------
function buildDijkstra() {
  var F = [], dist = {}, heap = [], settled = {}, declared = false,
      heapDeclared = false;
  // Not shown anywhere: dijkstra() as the students write it returns distances
  // and keeps no parent. Recorded only so the compare tab can say truthfully
  // whether the shortest-path tree and the MST landed on the same edges.
  var via = {};

  function snap(o) {
    o.dist = declared ? Object.assign({}, dist) : null;
    o.heap = heapDeclared ? copyHeap(heap) : null;
    o.settled = Object.assign({}, settled);
    o.via = Object.assign({}, via);
    F.push(o);
  }

  snap({ line: 0, lineEnd: 1,
    calc: "returns\n" +
      "    std::unordered_map<std::string, int>\n" +
      "    the string is a vertex name, the int is its distance\n" +
      "takes\n" +
      "    const std::string& source\n" +
      "    borrowed, not copied; const promises not to change it\n" +
      "const\n" +
      "    the graph itself is not modified",
    head: "Entering <code>dijkstra</code> with source <strong>" + SOURCE + "</strong>",
    why: ["the return type sits on its own line only because the whole signature would " +
          "not fit on one &mdash; it is not a separate statement",
          "the answer is returned, not stored on the object, which is what the trailing " +
          "<code>const</code> promises",
          "it is the same <code>dist</code> map built on the next line and handed back at " +
          "the end, one distance per vertex, all measured from " + SOURCE] });

  declared = true;
  snap({ line: 2, calc: "std::unordered_map<std::string, int> dist;\ndist is empty",
    head: "Create the map that will hold the answer",
    why: ["one entry per vertex: the name, and how far it is from the source",
          "empty right now &mdash; the next loop puts every vertex in it"] });

  var filled = [];
  VERTS.forEach(function (v, i) {
    if (i === 0) {
      snap({ line: 3, calc: "for (const auto& [vertex, edges] : adj_list_)\n" +
          "walks every key in the adjacency list — " + VERTS.join(", ") + "\n" + "const auto& \u2014 bound in place; without the & every edge list is copied",
        head: "Loop over every vertex in the graph",
        why: ["the keys of <code>adj_list_</code> are exactly the vertices"] });
    }
    dist[v] = INF;
    filled.push(v);
    snap({ line: 4, hot: v,
      calc: "dist[" + v + "] = numeric_limits<int>::max()\n" + filled.length + " of " +
            VERTS.length + " filled in",
      head: "<strong>" + v + "</strong> starts at &infin;",
      why: i === 0
        ? ["<code>max()</code> stands in for infinity &mdash; it means <em>no route " +
           "found yet</em>, not <em>no route exists</em>",
           "starting at 0 instead would claim every vertex is already reachable for free"]
        : [] });
  });

  snap({ line: 6, calc: "has_vertex(\"" + SOURCE + "\")   →   true, so we do not return",
    head: "The source really is in the graph",
    why: ["asked for a vertex that is not here, the function hands back the all-&infin; " +
          "map rather than crashing"] });

  dist[SOURCE] = 0;
  snap({ line: 7, hot: SOURCE,
    calc: "dist[" + SOURCE + "] = 0\nthe one distance we know for certain",
    head: "The source is 0 away from itself",
    why: ["this single known value is what the whole algorithm grows outward from"] });

  snap({ line: 9, calc: "using Pair = std::pair<int, std::string>;\n" +
      "a name for (distance, vertex) — nothing happens at run time",
    head: "Name the pair type the heap will hold",
    why: ["<code>using X = Y;</code> renames an existing type &mdash; the modern " +
          "<code>typedef</code>. Nothing is built and nothing runs",
          "it earns a line because <code>priority_queue</code> makes you name the element " +
          "type <strong>three times</strong>: the element, the container holding them, " +
          "and the comparator that orders them",
          "spelled out: <code>priority_queue&lt;pair&lt;int,string&gt;, " +
          "vector&lt;pair&lt;int,string&gt;&gt;, greater&lt;pair&lt;int,string&gt;&gt;&gt;</code>" +
          " &mdash; the alias is the difference between a line you can read and one you cannot",
          "distance comes <em>first</em> in the pair on purpose: pairs compare on their " +
          "first element, so the heap orders by distance without being told how"] });

  heapDeclared = true;
  snap({ line: 10, calc: "min_heap is created, empty\ngreater<Pair> makes it a MIN-heap",
    head: "Create the min-heap",
    why: ["<code>priority_queue</code> is a max-heap by default &mdash; " +
          "<code>std::greater</code> is what turns it round",
          "leave that out and you pull out the farthest vertex each time"] });

  heapPush(heap, [0, SOURCE]);
  snap({ line: 11, hot: SOURCE,
    calc: "min_heap.push({0, " + SOURCE + "})",
    head: "Seed the heap with the source",
    why: ["everything else gets discovered by relaxing edges from here"] });

  while (heap.length) {
    snap({ line: 13, calc: "!min_heap.empty()   →   true, " + heap.length +
        " entr" + (heap.length === 1 ? "y" : "ies") + " waiting",
      head: "The heap still has something in it", why: [] });

    var top = heap[0];
    snap({ line: 14, hot: top[1],
      calc: "auto [popped_dist, current] = min_heap.top()\npopped_dist = " + top[0] + ",  current = " + top[1],
      head: "Look at the nearest entry: <strong>" + top[1] + "</strong> at " + top[0],
      why: ["<code>top()</code> reads it; it is still in the heap until the next line"] });

    var pair = heapPop(heap), popped_dist = pair[0], current = pair[1];
    snap({ line: 15, hot: current,
      calc: "min_heap.pop()\n" + heap.length + " left",
      head: "Take it out of the heap", why: [] });

    var stale = popped_dist > dist[current];
    snap({ line: 16, hot: current, staleHit: stale,
      calc: stale
        ? "popped_dist > dist[current]   →   " + popped_dist + " > " + dist[current] + "   →   true, skip it"
        : "popped_dist > dist[current]   →   " + popped_dist + " > " + dist[current] + "   →   false, carry on",
      head: stale
        ? "<strong>" + current + "</strong> at " + popped_dist + " is stale &mdash; we already found " + dist[current]
        : "<strong>" + current + "</strong> is settled at " + popped_dist,
      why: stale
        ? ["this entry was pushed before a shorter route to " + current + " turned up",
           "nothing removes the old entry from the heap, so this line throws it away instead",
           "<strong>leave this line out and " + current + " is processed twice</strong>"]
        : ["no shorter route to " + current + " can appear now &mdash; everything still in the " +
           "heap is at least this far away"] });
    if (stale) continue;
    settled[current] = true;

    snap({ line: 18, hot: current,
      calc: "for (const auto& edge : adj_list_.at(current))\n" + current + " has " + ADJ[current].length +
            " neighbour" + (ADJ[current].length === 1 ? "" : "s") + ": " +
            ADJ[current].map(function (e) { return e.to + "(" + e.w + ")"; }).join(", ") + "\n" + "const auto& \u2014 each edge is borrowed, not copied, as the loop walks",
      head: "Try every edge out of <strong>" + current + "</strong>", why: [] });

    ADJ[current].forEach(function (e) {
      var nd = dist[current] + e.w, better = nd < dist[e.to];
      snap({ line: 19, hot: current, edge: [current, e.to],
        calc: "new_dist = dist[" + current + "] + " + e.w + " = " + dist[current] + " + " + e.w +
              " = " + nd,
        head: "Reaching <strong>" + e.to + "</strong> through " + current + " would cost " + nd,
        why: [] });
      snap({ line: 20, hot: current, edge: [current, e.to],
        calc: "new_dist < dist[" + e.to + "]   →   " + nd + " < " +
              (dist[e.to] === INF ? "∞" : dist[e.to]) + "   →   " + better,
        head: better
          ? "Yes &mdash; " + nd + " beats " + (dist[e.to] === INF ? "∞" : dist[e.to])
          : "No &mdash; " + e.to + " is already " + dist[e.to] + " away",
        why: better ? [] : ["the route we already have is as good or better, so nothing " +
                            "changes and nothing is pushed"] });
      if (better) {
        dist[e.to] = nd;
        via[e.to] = edgeId(current, e.to);
        snap({ line: 21, hot: current, edge: [current, e.to],
          calc: "dist[" + e.to + "] = " + nd,
          head: "Relax the edge: <strong>" + e.to + "</strong> is now " + nd + " away",
          why: ["\"relaxing\" just means replacing a distance with a better one"] });
        heapPush(heap, [nd, e.to]);
        snap({ line: 22, hot: current, edge: [current, e.to],
          calc: "min_heap.push({" + nd + ", " + e.to + "})",
          head: "Queue <strong>" + e.to + "</strong> up at its new distance",
          why: ["any older entry for " + e.to + " is still in the heap and is now wrong",
                "line 16 is what throws that one away when it surfaces"] });
      }
    });
  }

  snap({ line: 13, calc: "!min_heap.empty()   →   false, the heap is empty",
    head: "Nothing left to settle", why: [] });
  snap({ line: 26, done: true,
    calc: "return dist\n" + VERTS.slice().sort(function (a, b) { return dist[a] - dist[b]; })
      .map(function (v) { return v + "=" + dist[v]; }).join(",  "),
    head: "Done &mdash; the shortest distance from " + SOURCE + " to every vertex",
    why: ["Dijkstra answers <em>how far</em>, for every destination at once",
          "it never decides which edges to keep &mdash; that is the other algorithm"] });
  return F;
}

// ---------------------------------------------------------------------------
// Prim's -- frames
// ---------------------------------------------------------------------------
function buildPrims() {
  var F = [], inMst = {}, heap = [], mst = [], total = 0, declared = false,
      heapDeclared = false;

  function snap(o) {
    o.inMst = Object.assign({}, inMst);
    o.heap = heapDeclared ? copyHeap(heap) : null;
    o.mst = declared ? mst.map(function (x) { return x.slice(); }) : null;
    o.total = total;
    F.push(o);
  }

  snap({ line: 0, lineEnd: 1,
    calc: "returns\n" +
      "    std::pair<std::vector<std::tuple<...>>, int>\n" +
      "    .first the edges kept, .second their total weight\n" +
      "takes\n" +
      "    const std::string& start\n" +
      "    borrowed, not copied; const promises not to change it\n" +
      "const\n" +
      "    the graph itself is not modified",
    head: "Entering <code>prims_mst</code> from <strong>" + SOURCE + "</strong>",
    why: ["the return type sits on its own line only because the whole signature would " +
          "not fit on one &mdash; it is not a separate statement",
          "each edge is a <code>tuple</code> of (from, to, weight) &mdash; three things " +
          "travelling together",
          "unlike Dijkstra&rsquo;s this is not a distance per vertex: it is a set of edges, " +
          "and that difference is the whole point of the two algorithms"] });

  declared = true;
  snap({ line: 2, calc: "std::vector<std::tuple<...>> mst_edges;\nempty",
    head: "Create the list of edges the tree will keep",
    why: ["each entry is (from, to, weight) &mdash; a tuple, because an edge is three " +
          "things, not two"] });
  snap({ line: 3, calc: "int total_weight = 0;",
    head: "Start the running total at 0", why: [] });
  snap({ line: 5, calc: "std::unordered_set<std::string> in_mst;\nempty",
    head: "Create the set of vertices already in the tree",
    why: ["a set, not a vector: the only question ever asked of it is <em>is this one " +
          "already in?</em> &mdash; O(1) here, O(V) in a vector"] });

  inMst[SOURCE] = true;
  snap({ line: 6, hot: SOURCE,
    calc: "in_mst.insert(" + SOURCE + ")\n1 of " + VERTS.length + " vertices in the tree",
    head: "Start the tree at <strong>" + SOURCE + "</strong>",
    why: ["any vertex works &mdash; the minimum spanning tree comes out the same weight " +
          "whichever you start from"] });

  snap({ line: 8, calc: "using EdgeTuple = std::tuple<int, std::string, std::string>;\n" +
      "(weight, from, to) — nothing happens at run time",
    head: "Name the tuple the heap will hold",
    why: ["the same idea as <code>Pair</code> in Dijkstra&rsquo;s, one element wider " +
          "&mdash; a tuple because three things travel together, not two",
          "weight comes <strong>first</strong> so the heap orders by it",
          "put it last and the heap sorts by vertex name, which is a wrong tree that " +
          "still looks plausible"] });
  heapDeclared = true;
  snap({ line: 9, calc: "min_heap is created, empty\ngreater<EdgeTuple> makes it a MIN-heap",
    head: "Create the min-heap of candidate edges",
    why: ["Dijkstra's heap held vertices; this one holds <em>edges</em>, and that is the " +
          "real difference between the two algorithms"] });

  snap({ line: 11, hot: SOURCE,
    calc: "for (const auto& edge : adj_list_.at(" + SOURCE + "))\n" + SOURCE + " has " +
          ADJ[SOURCE].length + " edge" + (ADJ[SOURCE].length === 1 ? "" : "s") + "\n" + "const auto& \u2014 each edge is borrowed, not copied, as the loop walks",
    head: "Walk the edges leaving " + SOURCE, why: [] });
  ADJ[SOURCE].forEach(function (e) {
    heapPush(heap, [e.w, SOURCE, e.to]);
    snap({ line: 12, hot: SOURCE, edge: [SOURCE, e.to],
      calc: "min_heap.push({" + e.w + ", " + SOURCE + ", " + e.to + "})",
      head: "Offer up <strong>" + SOURCE + "&ndash;" + e.to + "</strong> at " + e.w,
      why: [] });
  });

  var V = VERTS.length;
  snap({ line: 15, calc: "const int V = vertex_count();   \u2192   " + V,
    head: "How many vertices the tree has to reach",
    why: ["the loop stops as soon as all " + V + " are in, which is why a spanning tree " +
          "has V&minus;1 = " + (V - 1) + " edges"] });

  while (heap.length && Object.keys(inMst).length < V) {
    snap({ line: 16, calc: "!empty (" + heap.length + " waiting)  &&  in_mst.size() < V   " +
        "\u2192   " + Object.keys(inMst).length + " < " + V + "   \u2192   true",
      head: "Edges still on offer, and vertices still outside the tree", why: [] });

    var top = heap[0];
    snap({ line: 17, edge: [top[1], top[2]],
      calc: "auto [w, from, to] = min_heap.top()\nw = " + top[0] + ",  " + top[1] +
            " \u2192 " + top[2],
      head: "Cheapest edge on offer: <strong>" + top[1] + "&ndash;" + top[2] +
            "</strong> at " + top[0], why: [] });

    var e2 = heapPop(heap), w = e2[0], from = e2[1], to = e2[2];
    snap({ line: 18, edge: [from, to], calc: "min_heap.pop()\n" + heap.length + " left",
      head: "Take it out of the heap", why: [] });

    var cycle = !!inMst[to];
    snap({ line: 19, edge: [from, to], staleHit: cycle,
      calc: "in_mst.count(" + to + ")   \u2192   " + (cycle ? "1, skip it" : "0, take it"),
      head: cycle
        ? "<strong>" + to + "</strong> is already in the tree &mdash; skip"
        : "<strong>" + to + "</strong> is new &mdash; take the edge",
      why: cycle
        ? ["both ends are already connected, so this edge would close a cycle",
           "a spanning tree has exactly V&minus;1 edges and no cycles",
           "<strong>leave this line out and you build a graph, not a tree</strong>"]
        : [] });
    if (cycle) continue;

    mst.push([from, to, w]);
    snap({ line: 21, edge: [from, to],
      calc: "mst_edges.push_back({" + from + ", " + to + ", " + w + "})\n" + mst.length +
            " edge" + (mst.length === 1 ? "" : "s") + " kept",
      head: "Keep <strong>" + from + "&ndash;" + to + "</strong>", why: [] });
    total += w;
    snap({ line: 22, edge: [from, to], calc: "total_weight += " + w + "   \u2192   " + total,
      head: "Total weight is now " + total, why: [] });
    inMst[to] = true;
    snap({ line: 23, edge: [from, to], hot: to,
      calc: "in_mst.insert(" + to + ")\n" + Object.keys(inMst).length + " of " + V +
            " vertices in the tree",
      head: "<strong>" + to + "</strong> joins the tree", why: [] });

    var offers = ADJ[to].filter(function (x) { return !inMst[x.to]; });
    snap({ line: 25, hot: to,
      calc: "for (const auto& edge : adj_list_.at(" + to + "))\n" + to + " has " +
            ADJ[to].length + " neighbour" + (ADJ[to].length === 1 ? "" : "s") + ", " +
            offers.length + " not yet in the tree" + "\n" + "const auto& \u2014 each edge is borrowed, not copied, as the loop walks",
      head: "Look at " + to + "'s own edges", why: [] });
    ADJ[to].forEach(function (x) {
      if (inMst[x.to]) {
        snap({ line: 26, hot: to, edge: [to, x.to],
          calc: "!in_mst.count(" + x.to + ")   \u2192   false, do not push",
          head: x.to + " is already in &mdash; no point offering this edge",
          why: ["filtering here keeps edges that would obviously close a cycle out of " +
                "the heap in the first place"] });
      } else {
        heapPush(heap, [x.w, to, x.to]);
        snap({ line: 27, hot: to, edge: [to, x.to],
          calc: "min_heap.push({" + x.w + ", " + to + ", " + x.to + "})",
          head: "Offer up <strong>" + to + "&ndash;" + x.to + "</strong> at " + x.w,
          why: [] });
      }
    });
  }

  snap({ line: 16,
    calc: Object.keys(inMst).length >= V
      ? "in_mst.size() < V   \u2192   " + Object.keys(inMst).length + " < " + V +
        "   \u2192   false"
      : "!min_heap.empty()   \u2192   false, no edges left",
    head: Object.keys(inMst).length >= V
      ? "Every vertex is in the tree &mdash; stop"
      : "No candidate edges left", why: [] });
  snap({ line: 31, done: true,
    calc: "return {mst_edges, " + total + "}\n" +
          mst.map(function (m) { return m[0] + "\u2013" + m[1] + " " + m[2]; }).join(",  "),
    head: "Done &mdash; " + mst.length + " edges, total weight " + total,
    why: ["V&minus;1 = " + (VERTS.length - 1) + " edges, which is what a spanning tree " +
          "always has",
          "Prim's answers <em>which edges to keep</em>, never how far anything is"] });
  return F;
}

// ---------------------------------------------------------------------------
// Drawing
// ---------------------------------------------------------------------------
function graphSvg(f, kind) {
  var W = 540, H = 300, out = "";
  var mstSet = {};
  if (kind === "prims" && f.mst) f.mst.forEach(function (m) { mstSet[m[0] + "|" + m[1]] = 1; mstSet[m[1] + "|" + m[0]] = 1; });

  EDGES.forEach(function (e) {
    var a = POS[e[0]], b = POS[e[1]];
    var live = f.edge && ((f.edge[0] === e[0] && f.edge[1] === e[1]) ||
                          (f.edge[0] === e[1] && f.edge[1] === e[0]));
    var inMst = mstSet[e[0] + "|" + e[1]];
    var col = live ? "#c64500" : inMst ? "#1c7e45" : "#c7cdd1";
    var wd = live ? 4 : inMst ? 4 : 2;
    out += '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] +
           '" stroke="' + col + '" stroke-width="' + wd + '"/>';
    var mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    out += '<circle cx="' + mx + '" cy="' + my + '" r="11" fill="#fff" stroke="' + col +
           '" stroke-width="1.5"/>' +
           '<text x="' + mx + '" y="' + (my + 4) + '" text-anchor="middle" font-size="11" ' +
           'font-weight="700" fill="' + (live || inMst ? col : "#555") + '">' + e[2] + "</text>";
  });

  VERTS.forEach(function (v) {
    var p = POS[v];
    var isHot = f.hot === v;
    var done = (f.settled && f.settled[v]) || (f.inMst && f.inMst[v]);
    var stroke = isHot ? "#c64500" : done ? "#1c7e45" : "#2573a7";
    out += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="26" fill="' +
           (done ? "#f2fbf4" : "#fff") + '" stroke="' + stroke + '" stroke-width="' +
           (isHot ? 4 : 2.5) + '"/>' +
           '<text x="' + p[0] + '" y="' + (p[1] + 1) + '" text-anchor="middle" font-size="12" ' +
           'font-weight="700" fill="#2c3e50">' + v + "</text>";
    if (f.dist) {
      var d = f.dist[v];
      // not a key yet: the loop below has not reached it, so there is
      // nothing to report and a label would be inventing one
      if (v in f.dist) {
        out += '<text x="' + p[0] + '" y="' + (p[1] + 15) + '" text-anchor="middle" ' +
               'font-size="11" font-weight="700" fill="' + (d === INF ? "#9aa4ad" : "#c64500") +
               '">' + (d === INF ? "∞" : d) + "</text>";
      }
    }
  });

  var label = kind === "prims"
    ? "Weighted graph of four Utah cities. Edges in the spanning tree so far are green."
    : "Weighted graph of four Utah cities, each labelled with its distance from " + SOURCE + ".";
  return '<svg class="graph" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' +
         label + '">' + out + "</svg>";
}

function codeHtml(key, f) {
  // A frame may span several listing lines via lineEnd. The band is emitted
  // after the LAST line of the span, never between -- a declaration split
  // across two lines has to stay whole on screen, or it reads as two
  // statements with a yellow block driven through the middle.
  var last = (f.lineEnd === undefined ? f.line : f.lineEnd);
  return '<div class="code">' + CODE[key].map(function (ln, i) {
    var hit = i >= f.line && i <= last;
    return "<div" + (hit ? ' class="hit"' : "") + ">" + (ln === "" ? "&nbsp;" : hl(ln)) + "</div>" +
      (i === last && f.calc ? '<div class="calc">' + esc(f.calc) + "</div>" : "");
  }).join("") + "</div>";
}

function heapHtml(f, kind) {
  if (!f.heap) return '<p class="empty">the <code>min_heap</code> does not exist yet'
             + ' &mdash; it is declared further down</p>';
  if (!f.heap.length) return '<p class="empty">empty</p>';
  return '<div class="heap">' + f.heap.map(function (h, i) {
    var txt = kind === "prims" ? h[0] + " : " + h[1] + "→" + h[2] : h[0] + " : " + h[1];
    var stale = kind === "dijkstra" && f.dist && h[0] > f.dist[h[1]];
    return '<span class="hp' + (i === 0 ? " top" : "") + (stale ? " stale" : "") + '">' +
           txt + "</span>";
  }).join("") + "</div>";
}

function distTable(f) {
  if (!f.dist) return '<p class="empty">the <code>dist</code> map does not exist yet'
             + ' &mdash; it is declared on the next line</p>';
  return '<table class="t"><thead><tr><th>Vertex</th><th>Distance from ' + SOURCE +
    "</th><th>Settled</th></tr></thead><tbody>" +
    VERTS.slice().sort().map(function (v) {
      var cls = f.hot === v ? " class=\"hot\"" : f.settled && f.settled[v] ? " class=\"done\"" : "";
      return "<tr" + cls + "><td>" + v + '</td><td class="n">' +
             (!(v in f.dist) ? "—"
                : f.dist[v] === INF ? "∞" : f.dist[v]) + "</td><td>" +
             (f.settled && f.settled[v] ? "✔" : "") + "</td></tr>";
    }).join("") + "</tbody></table>";
}

function mstTable(f) {
  if (!f.mst) return '<p class="empty">the <code>mst_edges</code> vector does not exist yet</p>';
  if (!f.mst.length) return '<p class="empty">no edges yet</p>';
  return '<table class="t"><thead><tr><th>Edge</th><th>Weight</th></tr></thead><tbody>' +
    f.mst.map(function (m) {
      return "<tr><td>" + m[0] + " &ndash; " + m[1] + '</td><td class="n">' + m[2] + "</td></tr>";
    }).join("") +
    '<tr class="done"><td><strong>Total</strong></td><td class="n"><strong>' + f.total +
    "</strong></td></tr></tbody></table>";
}

// Do the two algorithms end up keeping the same edges on the graph that is
// loaded? On the demo graph they do -- which is worth saying out loud, because
// tab 4 then shows two identical pictures and the honest conclusion from that
// is "sometimes they agree", not "they are always the same". Computed from the
// runs rather than written down, so it cannot go stale when a preset changes.
function treeAgreement(d, p) {
  var spt = Object.keys(d.via).map(function (v) { return d.via[v]; }).sort();
  var mst = p.mst.map(function (m) { return edgeId(m[0], m[1]); }).sort();
  var sptW = 0, mstW = 0;
  Object.keys(d.via).forEach(function (v) {
    EDGES.forEach(function (e) {
      if (edgeId(e[0], e[1]) === d.via[v]) sptW += e[2];
    });
  });
  p.mst.forEach(function (m) { mstW += m[2]; });
  return { same: spt.join() === mst.join(), sptW: sptW, mstW: mstW };
}

function compareHtml() {

  return '<div class="goal"><p class="goalhead"><span class="tag">GOAL</span>' +

    '<div class="card" style="margin-top:1rem"><h2>The difference in one line</h2>' +
    '<div class="card-body"><p style="margin:0">A shortest-path tree is built from one ' +
    "vertex&rsquo;s point of view and may contain an expensive edge because it is the fastest " +
    "way <em>there</em>. A minimum spanning tree has no point of view &mdash; it only cares " +
    "that the total is as small as possible. Start Dijkstra somewhere else and every distance " +
    "changes; start Prim&rsquo;s somewhere else and the tree comes out the same.</p>" +
    agree + "</div></div>";
}

function soloHtml(f, key) {
  var isD = key === "dijkstra";
  return '<div class="solo"><div class="col">' +
    '<div class="card"><h2>' + (isD ? "Shortest paths from " + SOURCE : "Building the spanning tree") +
    '</h2><div class="card-body">' + graphSvg(f, key) +
    '<p class="legend"><span><i style="border-color:#c64500"></i>being looked at</span>' +
    "<span><i style=\"border-color:#1c7e45;background:#f2fbf4\"></i>" +
    (isD ? "settled" : "in the tree") + "</span>" +
    '<span><i style="border-color:#2573a7"></i>not yet</span></p>' +
    "</div></div>" +
    '<div class="card"><h2>' +
      (isD ? "<code>dist</code> &mdash; best known distance to every vertex"
           : "<code>mst_edges</code> &mdash; the edges kept so far") + "</h2>" +
    '<div class="card-body">' + (isD ? distTable(f) : mstTable(f)) +
    '<p style="margin:.5rem 0 0;font-size:.82rem;color:#6e6e6e">' +
    (isD ? "<code>std::unordered_map&lt;std::string, int&gt;</code>. Every vertex starts at "
         + "&infin; except the source at 0, and a number only ever gets smaller. "
         + "<strong>The tick is this page&rsquo;s marker, not a variable</strong> &mdash; "
         + "there is no <code>settled</code> container in the code. Once a vertex is popped "
         + "without being stale its distance is final, and the stale check is what enforces "
         + "that."
         : "<code>std::vector&lt;std::tuple&lt;std::string, std::string, int&gt;&gt;</code>. "
         + "Finishes with exactly V&minus;1 edges.") + "</p>" +
    "</div></div>" +
    '<div class="card"><h2>The heap &mdash; ' +
    (isD ? "vertices waiting, nearest first" : "candidate edges, cheapest first") + "</h2>" +
    '<div class="card-body">' + heapHtml(f, key) +
    '<p style="margin:.5rem 0 0;font-size:.82rem;color:#6e6e6e">' +
    "<code>std::priority_queue</code> from <code>&lt;queue&gt;</code>, built inside the "
    + "function &mdash; the graph does not carry one. " +
    (isD ? "A struck-through entry is stale &mdash; a shorter route to that vertex was found "
         + "after it was pushed."
         : "Each entry is an edge: weight, then where it leads.") + "</p>" +
    "</div></div></div><div class=\"col\">" +
    '<div class="card"><h2>The code</h2><div class="card-body">' + codeHtml(key, f) +
    "</div></div>" +
    '<div class="card"><h2>What just happened</h2><div class="card-body">' +
    '<div class="nowbox"><p>' + f.head + "</p></div>" +
    (f.why && f.why.length
      ? '<ul class="why">' + f.why.map(function (w) { return "<li>" + w + "</li>"; }).join("") + "</ul>"
      : "") +
    "</div></div></div></div>";
}

// ---------------------------------------------------------------------------
// State and render
// ---------------------------------------------------------------------------
var state = { mode: "intro", preset: "demo", step: 0, runs: {}, maxFrames: 1, timer: null };

function compute() {
  useGraph(state.preset);
  state.runs = { dijkstra: buildDijkstra(), prims: buildPrims() };
  state.maxFrames = (state.mode === "intro" || state.mode === "compare")
    ? 1 : state.runs[state.mode].length;
  if (state.step >= state.maxFrames) state.step = state.maxFrames - 1;
}

function render() {
  var page = state.mode === "intro" || state.mode === "compare";
  document.getElementById("ctlBar").style.display = page ? "none" : "";
  var pb = document.getElementById("presetBar");
  pb.innerHTML = state.mode === "intro" ? "" :
    '<span class="barlab">Graph</span>' + Object.keys(GRAPHS).map(function (k) {
      return '<button class="ctl' + (k === state.preset ? " primary" : "") +
             '" data-preset="' + k + '">' + GRAPHS[k].label + "</button>";
    }).join("") + '<span class="barlab">' + GRAPHS[state.preset].note + "</span>";
  Array.prototype.forEach.call(pb.querySelectorAll("[data-preset]"), function (b) {
    b.addEventListener("click", function () {
      stopPlay(); state.preset = b.getAttribute("data-preset");
      state.step = 0; compute(); render();
    });
  });
  if (state.mode === "intro") document.getElementById("stage").innerHTML = introHtml();
  else if (state.mode === "compare") document.getElementById("stage").innerHTML = compareHtml();
  else {
    var f = state.runs[state.mode][Math.min(state.step, state.maxFrames - 1)];
    document.getElementById("stage").innerHTML = soloHtml(f, state.mode);
    document.getElementById("counter").textContent =
      "step " + (state.step + 1) + " of " + state.maxFrames;
    document.getElementById("first").disabled = state.step === 0;
    document.getElementById("prev").disabled = state.step === 0;
    document.getElementById("next").disabled = state.step >= state.maxFrames - 1;
    document.getElementById("last").disabled = state.step >= state.maxFrames - 1;
  }
  Array.prototype.forEach.call(document.querySelectorAll("#tabs [data-mode]"), function (b) {
    b.classList.toggle("on", b.getAttribute("data-mode") === state.mode);
  });
}

function go(n) { state.step = Math.max(0, Math.min(n, state.maxFrames - 1)); render(); }
function stopPlay() {
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
  var p = document.getElementById("play"); if (p) p.innerHTML = "&#9654; Play";
}
function play() {
  if (state.timer) { stopPlay(); return; }
  if (state.step >= state.maxFrames - 1) state.step = 0;
  document.getElementById("play").innerHTML = "&#10073;&#10073; Pause";
  state.timer = setInterval(function () {
    if (state.step >= state.maxFrames - 1) { stopPlay(); return; }
    go(state.step + 1);
  }, 900);
}

document.getElementById("first").addEventListener("click", function () { stopPlay(); go(0); });
document.getElementById("prev").addEventListener("click", function () { stopPlay(); go(state.step - 1); });
document.getElementById("next").addEventListener("click", function () { stopPlay(); go(state.step + 1); });
document.getElementById("last").addEventListener("click", function () { stopPlay(); go(state.maxFrames - 1); });
document.getElementById("play").addEventListener("click", play);
Array.prototype.forEach.call(document.querySelectorAll("#tabs [data-mode]"), function (b) {
  b.addEventListener("click", function () {
    stopPlay(); state.mode = b.getAttribute("data-mode"); state.step = 0; compute(); render();
  });
});
document.addEventListener("keydown", function (e) {
  if (state.mode === "intro" || state.mode === "compare") return;
  if (e.key === "ArrowRight") { e.preventDefault(); stopPlay(); go(state.step + 1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); stopPlay(); go(state.step - 1); }
  else if (e.key === " ") { e.preventDefault(); play(); }
});

// ---------------------------------------------------------------------------
// Self-check -- re-derives both answers independently and compares.
// ---------------------------------------------------------------------------
(function selftest() {
  var fails = [], runs = 0;

  // Plain Dijkstra, written without reference to the frame builder.
  function plainDijkstra(src) {
    var dist = {}, done = {};
    VERTS.forEach(function (v) { dist[v] = INF; });
    dist[src] = 0;
    for (var k = 0; k < VERTS.length; k++) {
      var best = null;
      VERTS.forEach(function (v) {
        if (!done[v] && dist[v] !== INF && (best === null || dist[v] < dist[best])) best = v;
      });
      if (best === null) break;
      done[best] = true;
      ADJ[best].forEach(function (e) {
        if (dist[best] + e.w < dist[e.to]) dist[e.to] = dist[best] + e.w;
      });
    }
    return dist;
  }

  // Kruskal, for the MST weight -- a different algorithm, so agreeing means
  // something. Prim's compared against Prim's would only prove it is stable.
  function kruskalWeight() {
    var parent = {}; VERTS.forEach(function (v) { parent[v] = v; });
    function find(a) { while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; } return a; }
    var total = 0, used = 0;
    EDGES.slice().sort(function (a, b) { return a[2] - b[2]; }).forEach(function (e) {
      var x = find(e[0]), y = find(e[1]);
      if (x !== y) { parent[x] = y; total += e[2]; used++; }
    });
    return { total: total, edges: used };
  }

  // Both graphs, because each exists to demonstrate a different line.
  var results = {};
  Object.keys(GRAPHS).forEach(function (key) {
    useGraph(key);
    results[key] = { d: buildDijkstra(), p: buildPrims(), src: SOURCE,
                     verts: VERTS.slice(), kr: kruskalWeight() };
    runs += 2;
  });
  useGraph("demo");
  var dFrames = results.demo.d, pFrames = results.demo.p;

  var want = plainDijkstra(SOURCE), got = dFrames[dFrames.length - 1].dist;
  VERTS.forEach(function (v) {
    if (got[v] !== want[v])
      fails.push("dijkstra " + v + ": got " + got[v] + ", expected " + want[v]);
  });
  if (got.Provo !== 5)
    fails.push("dijkstra: Provo should be 5 via Logan, not the direct 6");

  var k = results.demo.kr;
  Object.keys(results).forEach(function (key) {
    var r = results[key], last = r.p[r.p.length - 1];
    runs++;
    if (last.total !== r.kr.total)
      fails.push(key + "/prims: total " + last.total + ", Kruskal says " + r.kr.total);
    if (last.mst.length !== r.verts.length - 1)
      fails.push(key + "/prims: " + last.mst.length + " edges, a spanning tree needs " +
                 (r.verts.length - 1));
    var seen = {}, bad = false;
    last.mst.forEach(function (m) { if (seen[m[1]]) bad = true; seen[m[1]] = 1; });
    if (bad) fails.push(key + "/prims: a vertex was added to the tree twice");
  });

  // Every frame must point at a real line and carry a THIS STEP band.
  [["dijkstra", dFrames], ["prims", pFrames]].forEach(function (pair) {
    pair[1].forEach(function (f, i) {
      runs++;
      if (!(f.line >= 0 && f.line < CODE[pair[0]].length))
        fails.push(pair[0] + " frame " + i + ": line " + f.line + " is outside the listing");
      if (!f.calc) fails.push(pair[0] + " frame " + i + ": no THIS STEP band");
      if (!f.head) fails.push(pair[0] + " frame " + i + ": no narration");
    });
  });

  // The two lines everyone leaves out must actually be exercised.
  if (!dFrames.some(function (f) { return f.staleHit; }))
    fails.push("dijkstra: this graph never produces a stale heap entry, so the " +
               "continue line is never demonstrated");
  if (!results.cycle.p.some(function (f) { return f.staleHit; }))
    fails.push("prims: the second graph was supposed to reject a cycle edge and did not");
  if (pFrames.some(function (f) { return f.staleHit; }))
    fails.push("prims: the demo graph now rejects an edge -- the note saying it does not " +
               "is wrong");

  // The compare tab now states whether the two trees landed on the same edges,
  // in different words for each case. Lock both: these weights make them
  // coincide on the demo graph and diverge on the other, and a weight change
  // would quietly swap the branches, leaving the prose confidently wrong.
  // useGraph again inside the loop -- treeAgreement prices the shortest-path
  // tree out of the global EDGES, so it has to be the loaded graph's.
  Object.keys(GRAPHS).forEach(function (key) {
    useGraph(key);
    var r = results[key];
    var ag = treeAgreement(r.d[r.d.length - 1], r.p[r.p.length - 1]);
    runs++;
    if (key === "demo" && !(ag.same && ag.sptW === ag.mstW))
      fails.push("demo: the shortest-path tree and the MST no longer coincide, but the " +
                 "compare tab still says they are the same edges");
    if (key === "cycle" && !(ag.same === false && ag.sptW > ag.mstW))
      fails.push("cycle: this graph was supposed to make Dijkstra's tree cost more than " +
                 "Prim's, and no longer does");
  });
  useGraph("demo");

  document.getElementById("selftest").innerHTML = fails.length === 0
    ? '<span class="ok">&#x2714; Self-check passed</span> &mdash; ' + runs +
      " checks: Dijkstra's distances match an independently written shortest-path routine " +
      "and Provo comes out 5 by the two-hop route rather than 6 by the direct edge; Prim's " +
      "total matches <strong>Kruskal</strong>, a different MST algorithm, at " + k.total +
      " over " + (VERTS.length - 1) + " edges with no vertex added twice; every frame " +
      "highlights a real line and carries a THIS STEP band; both of the lines students " +
      "leave out &mdash; the stale-entry skip and the cycle check &mdash; actually fire on " +
      "this graph; and the two trees still coincide on this graph while diverging on the " +
      "other, which is what the comparison on tab 4 claims."
    : '<span class="fail">&#x2716; Self-check FAILED (' + fails.length + ")</span>: " +
      fails.slice(0, 6).join("; ");
})();

compute();
render();
</script>
</body>
</html>
